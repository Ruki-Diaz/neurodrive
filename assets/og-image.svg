<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="indigoGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6331FB" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#6331FB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#01010D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="78%" cy="52%" r="35%">
      <stop offset="0%" stop-color="#88F9C0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#01010D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#01010D"/>
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>
  <rect width="1200" height="630" fill="url(#mintGlow)"/>

  <!-- Subtle Grid / Road Perspective -->
  <g stroke="#6331FB" stroke-opacity="0.22" stroke-width="2">
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="866" y1="0" x2="866" y2="630" stroke-dasharray="18 22" stroke-opacity="0.35"/>
    <line x1="973" y1="0" x2="973" y2="630" stroke-dasharray="18 22" stroke-opacity="0.35"/>
  </g>

  <!-- Sensor Fan from Best Car -->
  <g stroke="#88F9C0" stroke-linecap="round">
    <line x1="920" y1="390" x2="775" y2="165" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6 6"/>
    <line x1="920" y1="390" x2="845" y2="130" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="920" y1="390" x2="920" y2="115" stroke-width="3" stroke-opacity="0.95"/>
    <line x1="920" y1="390" x2="995" y2="130" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="920" y1="390" x2="1065" y2="165" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6 6"/>
    <circle cx="845" cy="210" r="6" fill="#88F9C0"/>
    <circle cx="920" cy="115" r="6" fill="#88F9C0"/>
    <circle cx="1018" cy="250" r="6" fill="#88F9C0"/>
  </g>

  <!-- Ghost Indigo Cars -->
  <rect x="800" y="440" width="38" height="68" rx="10" fill="#6331FB" fill-opacity="0.28" stroke="#6331FB" stroke-opacity="0.5"/>
  <rect x="1005" y="330" width="38" height="68" rx="10" fill="#6331FB" fill-opacity="0.28" stroke="#6331FB" stroke-opacity="0.5"/>

  <!-- Best Car (Mint) -->
  <rect x="899" y="366" width="42" height="76" rx="12" fill="#88F9C0"/>
  <rect x="906" y="378" width="28" height="18" rx="5" fill="#01010D"/>
  <rect x="908" y="418" width="24" height="12" rx="4" fill="#01010D" fill-opacity="0.7"/>

  <!-- Left Typography & Branding -->
  <rect x="80" y="96" width="180" height="38" rx="19" fill="#6331FB" fill-opacity="0.18" stroke="#6331FB" stroke-opacity="0.55"/>
  <circle cx="104" cy="115" r="5" fill="#88F9C0"/>
  <text x="120" y="121" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">NEURODRIVE AI</text>

  <text x="80" y="255" fill="#FFFFFF" font-family="Anton, Impact, sans-serif" font-size="96" letter-spacing="2">TEACH CARS</text>
  <text x="80" y="360" fill="#FFFFFF" font-family="Anton, Impact, sans-serif" font-size="96" letter-spacing="2">TO DRIVE</text>
  <text x="80" y="445" fill="#88F9C0" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="68">without limits</text>

  <!-- Chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600">
    <rect x="80" y="495" width="130" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="145" y="523" fill="#88F9C0" text-anchor="middle">100 cars</text>

    <rect x="226" y="495" width="150" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="301" y="523" fill="#FFFFFF" text-anchor="middle">0 libraries</text>

    <rect x="392" y="495" width="145" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="464" y="523" fill="#88F9C0" text-anchor="middle">100% free</text>
  </g>
</svg>
