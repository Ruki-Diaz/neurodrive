<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="indigoGlow" cx="55%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#6331FB" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#6331FB" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#01010D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="78%" cy="52%" r="36%">
      <stop offset="0%" stop-color="#88F9C0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#01010D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#01010D"/>
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>
  <rect width="1200" height="630" fill="url(#mintGlow)"/>

  <!-- Stylized Melbourne Hoddle Grid -->
  <g transform="translate(885, 315) rotate(-20)">
    <g fill="#6331FB" fill-opacity="0.1" stroke="#6331FB" stroke-opacity="0.28" stroke-width="1">
      <rect x="-210" y="-210" width="85" height="80" rx="4"/>
      <rect x="-105" y="-210" width="85" height="80" rx="4"/>
      <rect x="0" y="-210" width="85" height="80" rx="4"/>
      <rect x="105" y="-210" width="85" height="80" rx="4"/>
      <rect x="-210" y="-105" width="85" height="80" rx="4"/>
      <rect x="-105" y="-105" width="85" height="80" rx="4"/>
      <rect x="0" y="-105" width="85" height="80" rx="4"/>
      <rect x="105" y="-105" width="85" height="80" rx="4"/>
      <rect x="-210" y="0" width="85" height="80" rx="4"/>
      <rect x="-105" y="0" width="85" height="80" rx="4"/>
      <rect x="0" y="0" width="85" height="80" rx="4"/>
      <rect x="105" y="0" width="85" height="80" rx="4"/>
      <rect x="-210" y="105" width="85" height="80" rx="4"/>
      <rect x="-105" y="105" width="85" height="80" rx="4"/>
      <rect x="0" y="105" width="85" height="80" rx="4"/>
      <rect x="105" y="105" width="85" height="80" rx="4"/>
    </g>

    <!-- Hoddle Grid Streets -->
    <g stroke="#6331FB" stroke-opacity="0.45" stroke-width="8">
      <line x1="-250" y1="-115" x2="220" y2="-115"/>
      <line x1="-250" y1="-12" x2="220" y2="-12"/>
      <line x1="-250" y1="92" x2="220" y2="92"/>
      <line x1="-115" y1="-250" x2="-115" y2="220"/>
      <line x1="-12" y1="-250" x2="-12" y2="220"/>
      <line x1="92" y1="-250" x2="92" y2="220"/>
    </g>

    <!-- Glowing Mint A* Route -->
    <polyline points="-12,185 -12,-12 -115,-12 -115,-175" stroke="#88F9C0" stroke-opacity="0.3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-12,185 -12,-12 -115,-12 -115,-175" stroke="#88F9C0" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Destination Beacon -->
    <circle cx="-115" cy="-175" r="14" stroke="#88F9C0" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="-115" cy="-175" r="6" fill="#88F9C0"/>

    <!-- Best Car -->
    <circle cx="-12" cy="40" r="8" fill="#88F9C0"/>
  </g>

  <!-- Left Typography & Branding -->
  <rect x="76" y="78" width="250" height="38" rx="19" fill="#6331FB" fill-opacity="0.18" stroke="#6331FB" stroke-opacity="0.55"/>
  <circle cx="100" cy="97" r="5" fill="#88F9C0"/>
  <text x="116" y="103" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">MELBOURNE CBD · HODDLE GRID</text>

  <text x="76" y="220" fill="#FFFFFF" font-family="Anton, Impact, sans-serif" font-size="82" letter-spacing="2">TEACH CARS TO</text>
  <text x="76" y="315" fill="#FFFFFF" font-family="Anton, Impact, sans-serif" font-size="82" letter-spacing="2">DRIVE MELBOURNE</text>
  <text x="76" y="395" fill="#88F9C0" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="64">on its own</text>

  <!-- Chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">
    <rect x="76" y="465" width="230" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="191" y="493" fill="#88F9C0" text-anchor="middle">Real OpenStreetMap data</text>

    <rect x="320" y="465" width="140" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="390" y="493" fill="#FFFFFF" text-anchor="middle">0 libraries</text>

    <rect x="474" y="465" width="135" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="541" y="493" fill="#88F9C0" text-anchor="middle">100% free</text>
  </g>
</svg>
